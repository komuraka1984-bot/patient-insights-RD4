name: Apply faster submission confirmation

on:
  push:
    paths:
      - ".github/workflows/apply-fast-submission-confirmation.yml"

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.py
        run: python .github/scripts/apply_fast_submission_confirmation.py

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Speed up post-submission confirmation"
          git push
